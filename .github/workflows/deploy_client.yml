name: Deploy GG.zip to server

on:
  push:
    branches: [ main ]
    paths:
      - 'GG.zip'
  # Cho phép bấm chạy tay ở tab Actions: deploy lại GG.zip đang có trên main mà không cần đổi file
  # (ví dụ sau khi sửa script deploy, hoặc khi lần chạy trước fail vì mạng/sai secret).
  workflow_dispatch:

# Hai lần push liên tiếp cùng dự án sẽ xếp hàng chứ không chạy chồng lên nhau.
# cancel-in-progress: false vì huỷ giữa lúc unzip sẽ để thư mục ở trạng thái nửa vời.
concurrency:
  group: deploy-wbs
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-zip.yml
    with:
      zip_name: GG.zip
      target_dir: /var/www/html/wbs
      cache_prefix: gunslinger-cache
    secrets: inherit
