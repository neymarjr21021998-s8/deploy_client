name: Deploy GG.zip to server

on:
  push:
    branches: [ main ]
    paths:
      - 'GG.zip'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy GG.zip to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "GG.zip"
          target: "/tmp/deploy-upload"

      - name: Extract on server + bump cache version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /var/www/html/wbs/

            # 1) Giải nén gói mới, KHÔNG ghi đè launcher (index.html) và sw.js ở thư mục gốc
            unzip -o /tmp/deploy-upload/GG.zip -d . -x index.html sw.js

            # 2) Thay file zip theo kiểu nguyên tử (copy ra file tạm rồi mv)
            cp /tmp/deploy-upload/GG.zip GG.zip.tmp
            mv -f GG.zip.tmp GG.zip
            rm -f /tmp/deploy-upload/GG.zip

            # 3) Đổi version cache ở CẢ HAI file thành cùng một giá trị mới
            VER="gunslinger-cache-r${{ github.run_number }}-$(date +%Y%m%d%H%M%S)"
            sed -i -E "s/(var[[:space:]]+CACHE[[:space:]]*=[[:space:]]*\")[^\"]*\"/\1${VER}\"/" index.html sw.js

            # 4) Kiểm tra đã thay thành công, nếu không thì báo lỗi cho workflow
            if grep -q "\"${VER}\"" index.html && grep -q "\"${VER}\"" sw.js; then
              echo "Cache version -> ${VER}"
            else
              echo "LỖI: không tìm thấy dòng 'var CACHE = \"...\"' trong index.html hoặc sw.js"
              exit 1
            fi